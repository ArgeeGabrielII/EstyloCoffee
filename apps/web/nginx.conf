limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server {
 listen 80; root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
 location = /api/auth/login { limit_req zone=login burst=5 nodelay; limit_req_status 429; proxy_pass http://api:3000; }
 location /api/ { proxy_pass http://api:3000; }
 location / { try_files $uri $uri/ /index.html; }
}
